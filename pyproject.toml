[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "family-spending-backend"
dynamic = ["version"]
description = "Versioned backend API for Family Spending"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[project.scripts]
family-spending-api = "family_spending_backend.interfaces.http.main:run"
family-spending-admin = "family_spending_backend.interfaces.cli.admin:main"

[tool.hatch.version]
path = "src/family_spending_backend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/family_spending_backend"]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
